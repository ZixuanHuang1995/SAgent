key: change_record
name: 變更紀錄
description: 改完之後用：記錄改之前和改之後的差異、為什麼改，以及影響到哪些地方。這種文件不畫圖。
order: 41
category: change
allow_diagrams: false
fixed_sections: true
sections:
  - heading: 變更摘要
    goal: 用一兩句話說明改了什麼、什麼時候改的、誰提出的。
  - heading: 變更原因
    goal: 說明為什麼要改：遇到的問題、新的需求或已經做的決定。只寫需求提到的事實。
  - heading: 差異對照
    goal: 用表格逐條列出改了什麼，欄位是編號、項目、改之前、改之後。
    ids: CH
  - heading: 影響範圍
    goal: 用表格列出受影響的文件、功能、資料或使用者，欄位是項目、影響、對應的變更編號。
  - heading: 後續事項
    goal: 列出還沒處理完的事，例如要更新的文件、要通知的人、要觀察的地方。
