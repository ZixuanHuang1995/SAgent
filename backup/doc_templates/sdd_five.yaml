key: sdd_five
name: SDD 功能規格（五節體例）
description: 依 Requirement → Decision → Constraint → Rule → Verification 五節撰寫，每個條目都有編號、可以互相對照。適合要交給 AI coding 工具實作的功能。
order: 3
category: feature
fixed_sections: true
sections:
  - heading: Requirement 需求
    goal: 先用一兩句話說明要做什麼、為什麼要做、誰會使用，再逐條列出需求。
    ids: R
    diagrams: [usecase]
  - heading: Decision 決策
    goal: 逐條列出已經決定的做法和原因，每條註明對應的需求編號。還沒決定的事不寫在這裡，寫進待確認事項。
    ids: D
    diagrams: [flowchart]
  - heading: Constraint 限制
    goal: 逐條列出技術、法規、時程、相容性等限制，每條寫清楚限制的內容和來源。
    ids: C
  - heading: Rule 規則
    goal: 逐條列出業務規則、計算規則和檢核規則。欄位規則和下拉選單的值域用表格說明。
    ids: RL
    diagrams: [state]
  - heading: Verification 驗證
    goal: 用「假設…當…則…」的格式寫驗收條件，每條註明對應的需求或規則編號。
    ids: V
