key: experiment_design
name: 實驗設計
description: 評估新工具或新做法的實驗計畫：目的和假設、指標、分組、流程，以及資料怎麼收集、分析和怎樣算成立。技術決策需要數據才能決定時使用。
order: 24
category: design
role: 實驗設計研究員
style: experiment
max_diagrams: 2
sections:
  - heading: 實驗目的
    goal: 說明要評估的工具或做法、想回答的問題，以及實驗結果會用來做什麼決定。
  - heading: 研究假設
    goal: 用表格列出要驗證的假設，欄位是編號、假設、比較的對象、預期結果、判斷用的指標編號。
    ids: H
  - heading: 指標定義
    goal: 用表格列出評估指標，欄位是編號、指標、定義、計算方式、資料來源。
    ids: M
  - heading: 實驗對象與分組
    goal: 說明參與者或樣本怎麼挑選、樣本數怎麼估、怎麼分組，以及怎麼避免分組造成的偏差。
  - heading: 實驗流程
    goal: 依時間順序說明實驗的每個階段、每組要做什麼、要控制哪些條件。
    diagrams: [flowchart]
  - heading: 資料收集與分析方法
    goal: 說明要收集哪些資料、怎麼記錄，每個假設用什麼統計方法分析，以及怎樣算假設成立。
  - heading: 風險與限制
    goal: 用表格列出可能影響結果的因素（例如樣本太少、學習效應、參與者知道自己在實驗中）和降低影響的做法。
