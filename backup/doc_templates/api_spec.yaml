key: api_spec
name: API 規格
description: 說明 API 的端點、參數、回應格式、錯誤碼和呼叫流程。
order: 23
category: design
sections:
  - heading: 概述
    goal: 說明 API 的用途、使用對象和版本；需求沒寫的網址標（待確認）。
  - heading: 驗證與授權
    goal: 說明呼叫端怎麼通過身分驗證，以及每種角色可以呼叫哪些端點。
  - heading: 端點清單
    goal: 用表格列出所有端點，欄位是編號、方法、路徑、說明、需要的權限。
    ids: API
  - heading: 端點說明
    goal: 每個端點用 ### 小標題（編號、方法和路徑），寫請求參數表格、請求範例 JSON、回應欄位表格和回應範例 JSON。
  - heading: 呼叫流程
    goal: 說明主要情境下依什麼順序呼叫哪些端點，引用端點編號。
    diagrams: [sequence]
  - heading: 錯誤碼
    goal: 用表格列出錯誤，欄位是 HTTP 狀態碼、錯誤碼、說明、呼叫端的處理方式。
  - heading: 限制與注意事項
    goal: 說明流量限制、分頁、時區、重複呼叫（冪等性）等注意事項。
