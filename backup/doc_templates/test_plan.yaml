key: test_plan
name: 測試計畫
description: 安排測試的範圍、環境、測試案例、通過標準和時程。可以對照功能規格或使用案例的驗收條件來寫。
order: 5
category: feature
role: 測試工程師
sections:
  - heading: 測試範圍
    goal: 列出這次要測試和不測試的功能，以及依據的規格文件。
  - heading: 測試環境與資料
    goal: 說明測試用的環境、帳號和測試資料怎麼準備。
  - heading: 測試案例
    goal: 用表格列出測試案例，欄位是編號、對應的需求或驗收條件、前置條件、操作步驟、預期結果。主要流程和例外情況都要有。
    ids: TC
  - heading: 通過標準
    goal: 說明怎樣算測試通過，以及缺失怎麼分級（例如嚴重、一般、輕微）和處理。
  - heading: 時程與分工
    goal: 用表格列出各測試階段的日期和負責單位；需求沒寫的日期標（待確認）。
    diagrams: [gantt]
