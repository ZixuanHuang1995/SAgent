key: change_request
name: 變更需求說明
description: 說明既有系統要改什麼、為什麼改、影響哪些地方，以及怎麼測試和上線。
order: 8
category: change
sections:
  - heading: 變更原因
    goal: 說明為什麼要改：遇到的問題或新的需求，以及提出的人或單位。
  - heading: 現況
    goal: 說明目前系統怎麼運作，只寫跟這次變更有關的部分。
  - heading: 變更內容
    goal: 逐條列出要改的地方，每條寫清楚改之前和改之後的差別。
    ids: CR
    diagrams: [flowchart]
  - heading: 影響範圍
    goal: 用表格列出受影響的畫面、資料、API、報表和其他功能，欄位是項目、影響、對應的變更編號。
  - heading: 相容性與資料轉換
    goal: 說明舊資料要不要轉換、怎麼轉換，以及跟其他系統的相容性。
  - heading: 測試範圍
    goal: 列出要測試的項目，包含變更的功能和可能被影響的既有功能（回歸測試），再用「假設…當…則…」的格式寫驗收條件。
    ids: AC
  - heading: 上線與回復
    goal: 說明上線步驟、需要通知的人，以及出問題時怎麼回復到原本的狀態。
