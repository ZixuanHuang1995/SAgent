key: experiment_design
name: 實驗設計
description: 評估新工具或新做法的實驗計畫：定義目的和假設、指標、分組和流程，說明資料怎麼收集、怎麼分析和怎樣算成立。
order: 9
category: algorithm
role: 實驗設計研究員
style: experiment
max_diagrams: 2
sections:
  - heading: 實驗目的
    goal: 說明要評估的工具或做法、想回答的問題，以及實驗結果會用來做什麼決定。
  - heading: 研究假設
    goal: 用表格列出要驗證的假設，編號 H-01、H-02…，寫比較的對象、預期結果和用哪個指標判斷。
  - heading: 指標定義
    goal: 用表格列出評估指標，編號 M-01、M-02…，寫定義、計算方式和資料來源。
  - heading: 實驗對象與分組
    goal: 說明參與者或樣本怎麼挑選、樣本數怎麼估、怎麼分組，以及怎麼避免分組造成的偏差。
  - heading: 實驗流程
    goal: 依時間順序說明實驗的每個階段、每組要做什麼、要控制哪些條件。
    diagrams: [flowchart]
  - heading: 資料收集與分析方法
    goal: 說明要收集哪些資料、怎麼記錄，用什麼統計方法分析每個假設，以及怎樣算假設成立。
  - heading: 風險與限制
    goal: 用表格列出可能影響結果的因素（例如樣本太少、學習效應、參與者知道自己在實驗中）和降低影響的做法。
