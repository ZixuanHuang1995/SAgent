key: uiux_advice
name: UI/UX 設計建議
description: 依需求提出畫面和操作上的建議，每條都有理由和優先順序。這是建議，不是規格；這種文件不畫圖。
order: 4
category: feature
role: UI/UX 設計師
style: advice
allow_diagrams: false
sections:
  - heading: 使用者與使用情境
    goal: 說明主要使用者是誰、在什麼情況下使用（裝置、環境、使用頻率、熟悉程度），以及最常做的工作。
  - heading: 重點建議
    goal: 用表格列出最重要的建議，欄位是編號、建議、理由、優先順序（高、中、低）。理由要寫出對應哪個需求或哪類使用者。
    ids: UX
  - heading: 畫面規劃
    goal: 用表格建議要有哪些畫面，欄位是畫面、用途、主要內容、主要操作；再用條列說明畫面之間怎麼切換。
  - heading: 操作流程
    goal: 針對最常做的工作建議操作步驟，減少點擊和輸入的次數，並說明常用功能要放在哪裡。
  - heading: 版面與資訊呈現
    goal: 建議主要畫面的版面和資訊的先後順序，以及清單要顯示哪些欄位、怎麼排序、篩選和搜尋。
  - heading: 表單與輸入
    goal: 建議欄位順序、預設值、必填標示、輸入格式和即時檢查的方式，盡量減少要輸入的內容。
  - heading: 提示訊息與錯誤處理
    goal: 用表格列出情境（成功、處理中、失敗、沒有資料）和建議的訊息文字。
  - heading: 無障礙與裝置支援
    goal: 建議鍵盤操作、顏色對比、字體大小、螢幕報讀的做法，以及手機或平板上要怎麼調整。
  - heading: 驗證方式
    goal: 建議怎麼確認設計好用：找哪些使用者、測哪些工作、看哪些指標（例如完成率、花費時間、錯誤次數）。
