key: uiux_advice
name: UI/UX 設計建議
description: 依需求提出畫面和操作上的建議，每條建議都寫出理由和優先順序。這種文件不畫圖。
order: 7
category: feature
role: UI/UX 設計師
style: advice
allow_diagrams: false
sections:
  - heading: 使用者與使用情境
    goal: 說明主要使用者是誰、在什麼情況下使用（裝置、環境、使用頻率、熟悉程度），以及他們最常做的工作。
  - heading: 重點建議
    goal: 用表格列出最重要的 UI/UX 建議，編號 UX-01、UX-02…，欄位是編號、建議、理由、優先順序（高、中、低）。理由要寫出對應哪個需求或哪類使用者。
  - heading: 畫面規劃
    goal: 用表格建議要有哪些畫面，欄位是畫面名稱、用途、主要內容、主要操作；再用條列說明畫面之間怎麼切換。
  - heading: 操作流程
    goal: 針對最常做的工作，建議操作步驟，減少點擊和輸入的次數，並說明常用功能要放在哪裡。
  - heading: 版面與資訊呈現
    goal: 建議主要畫面的版面安排和資訊的先後順序，清單和表格要顯示哪些欄位，以及怎麼排序、篩選和搜尋。
  - heading: 表單與輸入
    goal: 建議欄位順序、預設值、必填標示、輸入格式和即時檢查的方式，盡量減少使用者要輸入的內容。
  - heading: 提示訊息與錯誤處理
    goal: 建議操作成功、處理中、失敗、沒有資料時要顯示什麼，用表格列出情境和訊息文字範例。
  - heading: 無障礙與裝置支援
    goal: 建議鍵盤操作、顏色對比、字體大小、螢幕報讀的做法，以及在手機或平板上要怎麼調整。
  - heading: 驗證方式
    goal: 建議怎麼確認設計好用：找哪些使用者、測哪些工作、看哪些指標（例如完成率、花費時間、錯誤次數）。
