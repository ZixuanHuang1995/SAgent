key: tech_decision
name: 技術決策
description: 比較幾個技術方案，依限制和評估標準選出一個，說明理由、影響和要先驗證的地方。決定之後再寫系統架構和資料庫設計。
order: 4
category: design
role: 軟體架構師
style: decision
max_diagrams: 2
fixed_sections: true
sections:
  - heading: 背景與問題
    goal: 說明要做什麼決定、為什麼現在要決定，以及不決定會有什麼影響。只寫需求提到的事實。
  - heading: 限制與評估標準
    goal: 用表格列出方案必須遵守的限制（例如時程、預算、既有系統、法規）和比較方案用的評估標準，欄位是編號、類別（限制或標準）、內容、為什麼重要。
    ids: C
  - heading: 方案說明
    goal: 可以提出需求沒寫的方案。列出 2 到 3 個方案，每個方案用 ### 小標題，寫做法、優點、缺點和要付出的代價（人力、時間、維運）。
  - heading: 方案比較
    goal: 用表格比較各方案，每一列是一個評估標準（引用 C 編號），每一欄是一個方案，格子裡寫「較好」「普通」「較差」加一句理由。
  - heading: 建議方案
    goal: 說明建議選哪個方案、主要理由，以及為什麼不選其他方案。
    diagrams: [component]
  - heading: 影響與後續
    goal: 說明選定後要改哪些地方、有什麼風險、哪些地方要先驗證（例如試做或實驗設計），以及接下來要寫哪些設計文件。
