key: test_plan
name: 測試計畫
description: 安排測試的範圍、環境、測試案例、通過標準和時程。對照功能規格的驗證項目來寫。
order: 4
category: feature
role: 測試工程師
fixed_sections: true
requirement_hint: 貼上功能規格的功能需求和驗證項目，再補上測試環境、測試人員和時程。
requirement_example: |
  依據：〈規格文件名稱〉的〈編號範圍〉（直接貼內容更好）。
  環境：〈幾台機器或什麼環境〉，測試資料用〈來源〉。
  人力與時程：〈幾人〉，〈起訖日期〉，〈報告交付日〉。
sections:
  - heading: 測試範圍
    goal: 列出這次要測試和不測試的功能，以及依據的規格文件。
  - heading: 測試環境與資料
    goal: 說明測試用的環境、帳號和測試資料怎麼準備。
  - heading: 測試案例
    goal: 用表格列出測試案例，欄位是編號、對應的需求或驗證項目、前置條件、操作步驟、預期結果。主要流程和例外情況都要有。
    ids: TC
  - heading: 通過標準
    goal: 說明怎樣算測試通過，以及缺失怎麼分級（例如嚴重、一般、輕微）和處理。
