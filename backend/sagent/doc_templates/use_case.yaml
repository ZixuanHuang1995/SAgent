key: use_case
name: 使用案例規格
description: 以角色和系統的互動為主：列出使用案例，寫每個案例的主要流程、替代流程、例外流程和驗證方式。適合角色多、流程分支多的功能。
order: 2
category: feature
fixed_sections: true
sections:
  - heading: 概述
    goal: 說明這組使用案例涵蓋哪些功能，以及不包含的部分。
  - heading: 角色
    goal: 用表格列出角色，欄位是角色、說明、主要目標。
  - heading: 使用案例總覽
    goal: 用表格列出所有使用案例，欄位是編號、名稱、主要角色、說明。
    ids: UC
    diagrams: [usecase]
  - heading: 使用案例說明
    goal: 每個使用案例用 ### 小標題（編號加名稱），依序寫前置條件、主要流程（編號步驟）、替代流程、例外流程和後置條件。
    diagrams: [sequence]
  - heading: 狀態變化
    goal: 說明主要資料有哪些狀態，以及在哪個使用案例、什麼條件下轉換到下一個狀態。
    diagrams: [state]
  - heading: 業務規則
    goal: 逐條列出使用案例要遵守的規則，每條註明適用的使用案例編號。
    ids: BR
  - heading: 驗證方式
    goal: 用表格列出驗收條件，欄位是編號、對應使用案例、假設、當、則。每個使用案例的主要流程和例外流程都要有。
    ids: AC
