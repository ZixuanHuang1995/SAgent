key: database
name: 資料庫設計
description: 說明資料模型、資料表欄位、索引，以及資料怎麼建立、封存、移轉和備份。
order: 6
category: design
sections:
  - heading: 設計說明
    goal: 說明資料庫的用途、使用的資料庫產品和命名規則；需求沒寫的產品標（待確認）。
  - heading: 資料模型
    goal: 列出資料實體，說明實體之間的關聯（一對一、一對多、多對多）。
    diagrams: [er]
  - heading: 資料表定義
    goal: 每張資料表用 ### 小標題（資料表名稱），再用表格列出欄位，欄位是名稱、型別、長度、必填、預設值、說明。
  - heading: 索引與限制
    goal: 用表格列出主鍵、外來鍵、唯一鍵和索引，欄位是資料表、類型、欄位、原因。
  - heading: 資料生命週期
    goal: 說明主要資料怎麼建立、更新、封存和刪除，以及要保存多久。
    diagrams: [state]
  - heading: 資料移轉與備份
    goal: 說明初始資料和舊資料怎麼移轉，以及備份和還原的做法。
