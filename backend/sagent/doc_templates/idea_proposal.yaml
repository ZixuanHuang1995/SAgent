key: idea_proposal
name: 構想提案
description: 把還在構想階段的想法整理清楚：要解決什麼問題、給誰用、打算怎麼做、有哪些假設要先確認。不寫細節規格。
order: 9
category: idea
style: idea
max_diagrams: 1
sections:
  - heading: 背景與問題
    goal: 說明現在遇到什麼問題、影響到誰、在什麼情況下發生。只寫需求提到的事實。
  - heading: 目標使用者與情境
    goal: 說明誰會使用、在什麼情況下使用、他們想完成什麼事。
  - heading: 構想說明
    goal: 用幾句話說明打算怎麼解決，再列出主要使用情境，最後列出這次要做和不做的範圍。
    diagrams: [flowchart]
  - heading: 可能的做法
    goal: 可以提出需求沒寫的做法。列出 2 到 3 種做法，用表格比較：做法、說明、優點、缺點，最後寫建議選哪一種和理由。
  - heading: 預期效益
    goal: 說明解決後會有什麼改善，盡量寫成可以量測的指標；需求沒有數字就標（待確認）。
  - heading: 假設與風險
    goal: 列出這個構想成立需要的前提，以及可能的風險和因應方式。
  - heading: 下一步
    goal: 列出要先確認的事（問誰、怎麼確認），以及確定要做之後要寫哪些規格文件。
