key: idea_proposal
name: 構想提案
description: 把還在構想階段的想法整理清楚：要解決什麼問題、給誰用、使用者故事、怎樣算成功、可能的做法，以及要先確認的假設。不寫細節規格。
order: 1
category: idea
style: idea
max_diagrams: 1
fixed_sections: true
sections:
  - heading: 背景與問題
    goal: 說明現在遇到什麼問題、影響到誰、在什麼情況下發生。只寫需求提到的事實。
  - heading: 目標使用者與情境
    goal: 說明誰會使用、在什麼情況下使用、想完成什麼事。
  - heading: 構想說明
    goal: 用幾句話說明打算怎麼解決，再列出這次要做和不做的範圍。
    diagrams: [flowchart]
  - heading: 使用者故事
    goal: 用表格列出主要的使用者故事，欄位是編號、使用者故事。每條寫成「身為〈角色〉，我想要〈做什麼〉，以便〈得到什麼〉」，角色和目的要從需求看得出來。
    ids: US
  - heading: 驗收條件
    goal: 用表格列出每個使用者故事怎樣算成功，欄位是編號、對應的 US 編號、怎樣算成功。只寫使用者看得到的結果，不寫欄位、錯誤碼、畫面細節；需求沒有的數字標（待確認）。
    ids: AC
  - heading: 可能的做法
    goal: 可以提出需求沒寫的做法。列出 2 到 3 種做法，用表格比較，欄位是做法、說明、優點、缺點，最後寫建議選哪一種和理由。
  - heading: 假設與風險
    goal: 列出這個構想成立需要的前提，以及可能的風險和因應方式。
  - heading: 下一步
    goal: 列出要先確認的事（問誰、怎麼確認），以及確定要做之後要寫哪些規格文件。
