key: functional_spec
name: 功能規格書
description: 目的、需求、流程、規則和驗證項目。
order: 3
category: feature
fixed_sections: true
requirement_hint: 描述這個功能要解決什麼問題、給誰用，並列出包含和不包含的範圍。也可以直接貼上構想提案或使用案例。
requirement_example: |
  目的：〈這個功能要解決什麼問題、給誰用〉。
  範圍：
    包含：〈功能一〉、〈功能二〉。
    不包含：〈功能三〉、〈功能四〉。
  名詞定義：
    - 名詞：〈名詞一〉
      說明：〈說明一〉
    - 名詞：〈名詞二〉
      說明：〈說明二〉
  角色與使用案例：
    - 角色：〈角色一〉
      說明：〈說明一〉
      可以做的事：〈可以做的事一〉、〈可以做的事二〉。
    - 角色：〈角色二〉
      說明：〈說明二〉
      可以做的事：〈可以做的事三〉、〈可以做的事四〉。
sections:
  - heading: 目的與範圍
    goal: 說明這個功能要解決什麼問題、給誰用，再分成「包含」和「不包含」兩個清單列出範圍。
  - heading: 名詞定義
    goal: 用表格列出文件裡的專有名詞和縮寫，欄位是名詞、說明。只列需求裡出現的名詞。
  - heading: 角色與使用案例
    goal: 用表格列出會使用這個功能的角色，欄位是角色、說明、可以做的事。
    diagrams: [usecase]
  - heading: 功能需求
    goal: 逐條列出系統要做的事，每條先用一句話說明，再用子項目寫輸入、處理和輸出。
    ids: FR
  - heading: 業務流程
    goal: 用編號步驟說明主要流程，再列出例外情況和處理方式。
    diagrams: [flowchart]
  - heading: 業務規則
    goal: 逐條列出業務規則和檢核條件，每條寫清楚在什麼條件下、系統要怎麼做。
    ids: BR
  - heading: 非功能需求
    goal: 列出效能、安全、可用性、稽核等要求，盡量寫成可以量測的數字；需求沒有數字就標（待確認）。
    ids: NFR
  - heading: 驗證項目
    goal: 用「假設…當…則…」的格式寫驗證項目，每條註明對應的功能需求編號。
    ids: VRC
