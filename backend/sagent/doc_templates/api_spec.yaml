key: api_spec
name: API 規格
description: 說明 API 的端點、參數、回應格式、錯誤碼和呼叫流程。
order: 5
category: design
sections:
  - heading: 概述
    goal: 說明 API 的用途、使用對象、版本和 Base URL。
  - heading: 驗證與授權
    goal: 說明怎麼取得和帶入 token，以及權限範圍。
  - heading: 端點清單
    goal: 用表格列出所有端點：方法、路徑、說明、需要的權限。
  - heading: 端點說明
    goal: 每個端點寫出請求參數表格、請求範例 JSON、回應欄位表格和回應範例 JSON。
  - heading: 呼叫流程
    goal: 說明主要情境下 API 的呼叫順序。
    diagrams: [sequence]
  - heading: 錯誤碼
    goal: 用表格列出 HTTP 狀態碼、錯誤碼、說明和處理建議。
  - heading: 限制與注意事項
    goal: 說明流量限制、分頁、時區、重複呼叫（冪等性）等注意事項。
